name: Update Profile Art

on:
  schedule:
    # 06:17 UTC daily (offset time avoids peak GitHub Actions queue)
    - cron: "17 6 * * *"
  workflow_dispatch:   # allow manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      # Only re-run on pushes that change data or script sources
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/theme.py"
      - "scripts/utils.py"
      - "scripts/requirements-ci.txt"

permissions:
  contents: write   # needed to push the auto-commit

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install CI dependencies
        # CI-only: requests + beautifulsoup4 only.
        # Does NOT install pillow/rembg/opencv/numpy — portrait pipeline
        # is run locally, not in CI.
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          # Exit cleanly if nothing changed
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
